name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: false
        default: "main"
      install_dev:
        description: "Install dev dependencies (true/false)"
        required: false
        default: "false"  

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            BRANCH="${{ github.event.inputs.branch || 'main' }}"
            INSTALL_DEV="${{ github.event.inputs.install_dev || 'false' }}"
            
            cd "$APP_DIR"
            
            # 1. Kodu Güncelle
            git fetch origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            
            # 2. GÜNCELLEME: .env Dosyasını GitHub Secrets'tan Yeniden Oluştur
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF
            
            # 3. Docker Yapısını Kur ve Kapsayıcıları Yeniden Başlat
            # --remove-orphans: Eski/artık kalmış container'ları temizler
            docker compose --env-file .env build --build-arg INSTALL_DEV="$INSTALL_DEV"
            docker compose --env-file .env up -d --remove-orphans
