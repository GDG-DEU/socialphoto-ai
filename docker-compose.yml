services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-service-api
    command: uv run uvicorn app:combined_app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - socialphoto_network
    environment:
      - REDIS_HOST=socialphoto_redis
    volumes:
      - .:/app
    restart: unless-stopped

  analyze_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m src.workers.analyze_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=socialphoto_redis
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - socialphoto_network

  nsfw_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m src.workers.nsfw_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=socialphoto_redis
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - socialphoto_network

networks:
  socialphoto_network:
    external: true
