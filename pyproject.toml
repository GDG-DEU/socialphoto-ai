[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudinary>=1.44.1",
    "fastapi>=0.128.0",
    "google-genai>=1.15.0",
    "huggingface-hub>=1.11.0",
    "numpy>=2.4.2",
    "onnxruntime>=1.24.3",
    "pydantic-settings>=2.10.0",
    "pillow>=12.1.0",
    "pinecone>=8.0.0",
    "python-dotenv>=1.2.1",
    "python-socketio>=5.16.0",
    "redis>=7.1.0",
    "torch>=2.10.0",
    "transformers>=5.0.0",
    "uvicorn>=0.40.0",
    "httpx>=0.27.0",
    "torchvision>=0.26.0",
    "openai>=2.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.32.5",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
