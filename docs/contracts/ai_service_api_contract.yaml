openapi: 3.0.3
info:
  title: AI Service API
  description: |
    Görsel analiz, vektör benzerlik araması, agent tabanlı sohbet ve güvenlik kontrolleri
    sağlayan servis için API sözleşmesi.
  version: 1.0.0

servers:
  - url: https://api.example.com
    description: Production

security:
  - ApiKeyAuth: []

paths:
  /analyze:
    post:
      summary: Görsel Analiz (Async Job)
      description: |
        Görsel analiz işlemini asenkron bir job olarak başlatır.
        İş Redis queue'ya alınır ve hemen bir job_id döndürülür.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '202':
          description: Analiz job'u kuyruğa alındı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobResponse'
        '400':
          description: Geçersiz istek
        '500':
          description: Sunucu hatası

  /analyze/{job_id}:
    get:
      summary: Görsel Analiz Job Durumu
      description: |
        Belirtilen job_id için analiz durumunu ve varsa sonucu döndürür.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job durumu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobStatusResponse'
        '404':
          description: Job bulunamadı
        '500':
          description: Sunucu hatası

  /upsert:
    post:
      summary: Vektör Upsert
      description: |
        Yeni bir post görseli için vektör ve metadata kaydı oluşturur veya günceller.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequest'
      responses:
        '200':
          description: Başarılı kayıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertResponse'
        '500':
          description: Sunucu hatası

  /delete-record:
    post:
      summary: Vektör Silme
      description: |
        Verilen post_id'ye ait vektör kaydını siler.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Başarılı silme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '500':
          description: Sunucu hatası

  /sim-search:
    post:
      summary: Metin Tabanlı Benzerlik Araması
      description: |
        Metin ve/veya görsel sorgusunu vektöre çevirir ve vector database
        üzerinde en benzer sonuçları döndürür.
        En az bir tanesi (query_text veya cloudinary_public_id) sağlanmalıdır.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimSearchRequest'
      responses:
        '200':
          description: Benzerlik araması sonuçları
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimSearchResponse'
        '400':
          description: Geçersiz istek
        '500':
          description: Sunucu hatası

  /chat:
    post:
      summary: Agent Sohbet
      description: |
        Stateless agentic sohbet akışını çalıştırır.
        Servis konuşma/session state tutmaz; her istekte gelen history üzerinden çalışır.
        Kullanıcıya gösterilecek metni `reply` alanında döner.
        Backend için yapılandırılmış tool çıktıları `actions` alanında döner.
        Cloudinary public ID gibi internal alanlar kullanıcı metninden ayrıştırılır,
        backend'e `actions` içinde iletilir.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Sohbet cevabı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '500':
          description: Sunucu hatası

  /nsfw-check:
    post:
      summary: NSFW İçerik Kontrolü (Async Job)
      description: |
        NSFW içerik tespitini asenkron bir job olarak başlatır.
        İş Redis queue'ya alınır ve hemen bir job_id döndürülür.
        Sonuç Socket.IO bildirimi ile iletilir.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NSFWCheckRequest'
      responses:
        '200':
          description: NSFW kontrolü sonucu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSFWCheckResponse'
        '500':
          description: Sunucu hatası

  /health:
    get:
      summary: Sistem Durumu
      description: Servisin ve modellerin ayakta olup olmadığını kontrol eder.
      security: []
      responses:
        '200':
          description: Sistem durumu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    AnalyzeRequest:
      type: object
      required:
        - post_id
        - cloudinary_public_id
      properties:
        post_id:
          type: string
          description: Analiz edilecek postun ID'si
        cloudinary_public_id:
          type: string
          description: Cloudinary'deki görselin public ID'si (örn. "photos/cld-sample-5")
        language:
          type: string
          description: AI geri bildirimi (critique) için dil seçeneği (örn. "tr", "en"). Varsayılan "en".
          default: "en"

    UpsertItem:
      type: object
      required:
        - post_id
        - cloudinary_public_id
      properties:
        post_id:
          type: string
        cloudinary_public_id:
          type: string
          description: Cloudinary'deki görselin public ID'si

    UpsertRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpsertItem'

    UpsertResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, failed]
        count:
          type: integer

    DeleteRequest:
      type: object
      required:
        - post_id
      properties:
        post_id:
          type: string

    DeleteResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, failed]
        vector_id:
          type: string

    AnalyzeJobResponse:
      type: object
      properties:
        job_id:
          type: string
          description: Oluşturulan job ID
        status:
          type: string
          example: queued

    AnalyzeJobStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [queued, processing, completed, failed]
        result:
          type: object
          nullable: true
          properties:
            metrics:
              type: object
              properties:
                aesthetic:
                  type: object
                  properties:
                    overall_score: { type: number, format: float }
                    technical_quality: { type: number, format: float }
                    lighting_score: { type: number, format: float }
                    composition_score: { type: number, format: float }
                composition_details:
                  type: object
                  properties:
                    rule_of_thirds: { type: number, format: float }
                    symmetry: { type: number, format: float }
                    depth_of_field: { type: string }
                    balance: { type: string }
                visual_characteristics:
                  type: object
                  properties:
                    contrast: { type: number, format: float }
                    saturation: { type: number, format: float }
                    sharpness: { type: number, format: float }
                    exposure: { type: string }
            color_profile:
              type: object
              properties:
                dominant_colors:
                  type: array
                  items: { type: string }
                color_harmony: { type: string }
                vibrancy: { type: number, format: float }
            semantic_analysis:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
                scene_type: { type: string }
                mood: { type: string }
                objects_detected:
                  type: array
                  items:
                    type: object
                    properties:
                      label: { type: string }
                      confidence: { type: number, format: float }
            ai_feedback:
              type: object
              properties:
                short_critique: { type: string }
                improvement_tips:
                  type: array
                  items: { type: string }
        error:
          type: string
          nullable: true

    SimSearchRequest:
      type: object
      oneOf:
        - required: [query_text]
        - required: [cloudinary_public_id]
      properties:
        query_text:
          type: string
          description: Benzerlik araması için metin sorgusu (query_text veya cloudinary_public_id'den en az biri zorunlu)
        cloudinary_public_id:
          type: string
          description: Benzerlik araması için Cloudinary görsel public ID'si (query_text veya cloudinary_public_id'den en az biri zorunlu)
        top_k:
          type: integer
          minimum: 1
          default: 5
          description: Döndürülecek sonuç sayısı

    SimSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              image_url:
                type: string
                format: uri
              sim_score:
                type: number
                format: float

    ChatRequest:
      type: object
      required:
        - user_id
        - message
      properties:
        user_id:
          type: string
        message:
          type: string
        history:
          type: array
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [USER, ASSISTANT]
                description: Mesaj rolü. USER -> Gemini user, ASSISTANT -> Gemini model.
              content:
                type: string
                description: Mesaj metni.
              tool_calls:
                type: object
                nullable: true
                description: Mesajla ilişkili tool payload'ları.
                properties:
                  cloudinary_public_id:
                    type: string
                    description: Mesajla ilişkili Cloudinary image public ID.
        cloudinary_public_id:
          type: string
          nullable: true
          description: Mevcut kullanıcı mesajı için opsiyonel Cloudinary image public ID.

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
          description: Kullanıcıya gösterilecek sanitize edilmiş agent cevabı.
        actions:
          type: array
          nullable: true
          description: Backend için tool çıktıları (UI'da doğrudan gösterilmez).
          items:
            $ref: '#/components/schemas/Action'
    
    Action:
      type: object
      required:
        - type
        - parameters
      properties:
        type:
          type: string
          description: Action türü (örn. "search_similar_images_result")
          example: search_similar_images_result
        parameters:
          type: object
          description: Action için gerekli parametreler/tool sonucu
          example:
            cloudinary_public_ids:
              - "chat-temp/abc123"
              - "gallery/def456"
            result:
              results:
                - cloudinary_public_id: "chat-temp/abc123"
                  sim_score: 0.98

    NSFWCheckRequest:
      type: object
      required:
        - cloudinary_public_id
      properties:
        cloudinary_public_id:
          type: string
          description: Kontrol edilecek görselin Cloudinary public ID'si

    NSFWCheckResponse:
      type: object
      properties:
        job_id:
          type: string
          description: Oluşturulan job ID
        status:
          type: string
          enum: [queued]
          example: queued

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: online
        models_loaded:
          type: array
          items:
            type: string

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Required for all endpoints except /health.
